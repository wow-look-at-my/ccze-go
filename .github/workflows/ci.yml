name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write   # mint OIDC token for buildhost auth
      contents: write   # read repo for the build + dependency submission
      actions: read     # download build artifact for buildhost-publish
      checks: read      # all-builds guard scans this run's checks
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        uses: wow-look-at-my/go-toolchain@lkgb
        with:
          autorelease: 'true'
          # The org-pinned modules push the matrix build past the action's 10-minute default, so give it room to finish.
          timeout: 30

  benchmark:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # go.mod tracks the org modules by branch (v0.0.0), which stock Go cannot resolve.
      - name: Pin the org modules to their master heads for stock Go
        run: |
          go mod edit -droprequire=github.com/wow-look-at-my/go-containers -droprequire=github.com/wow-look-at-my/go-regex-compiler
          go get github.com/wow-look-at-my/go-containers@master github.com/wow-look-at-my/go-regex-compiler@master

      - name: Install C ccze build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev libpcre3-dev hyperfine valgrind

      - name: Build C ccze from source
        run: |
          git clone https://github.com/cornet/ccze.git /tmp/ccze
          cd /tmp/ccze && ./configure CFLAGS="-O3 -g" && make
          sudo cp src/ccze /usr/local/bin/ccze
          sudo mkdir -p /usr/local/lib/ccze
          sudo cp src/*.so /usr/local/lib/ccze/

      - name: Run benchmarks
        run: testdata/bench-summary.sh

      - name: CPU profile — Go (pprof)
        run: |
          go test -bench='BenchmarkFullPipeline' -benchtime=5s -cpuprofile=cpu.prof -count=1 .
          echo "### CPU Profile — Go (pprof top 20)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool pprof -top -nodecount=20 cpu.prof 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### CPU Profile — Go (pprof top 10 cumulative)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool pprof -top -cum -nodecount=10 cpu.prof 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: CPU profile — C ccze (callgrind)
        run: |
          set -x
          cat testdata/mixed.log | valgrind --tool=callgrind --callgrind-out-file=callgrind.out \
            ccze -A > /dev/null
          echo "### CPU Profile — C ccze (callgrind top functions)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          callgrind_annotate callgrind.out | head -60 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The job summary above carries the profiles, so nothing is uploaded as an artifact.
